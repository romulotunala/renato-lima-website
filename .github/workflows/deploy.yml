name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
      NEXT_PUBLIC_BASE_URL: https://personalrenatolima.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Validate exported assets
        run: |
          for asset in \
            images/logo_renato_white.png \
            images/photo-1534438327276-14e5300c3a48.avif \
            images/img_renato_lima.png \
            images/img_renato_aula.jpeg \
            pin_drop_orange.svg \
            event_busy_orange.svg \
            trending_down_orange.svg \
            nutrition_orange.svg \
            sell_orange.svg \
            mobile_orange.svg \
            arrow_down.svg; do
            test -f "out/$asset"
            grep -q "/$asset" out/index.html
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
